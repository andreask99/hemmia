name: Something doesn't work
description: Report a bug in the hub, the phone app or the website.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste chat contents, passphrases, API keys, invite links or recovery codes.
        Security problems: see SECURITY.md instead of opening an issue.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Hub on a Mac
        - Hub with Docker
        - Phone app, connected to a hub
        - Phone app, on its own
        - Website
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → System on the hub, or the app's version.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
