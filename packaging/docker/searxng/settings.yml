# SearXNG for the Hemmia Docker setup (packaging/docker/compose.yaml): same settings as
# ops/searxng/settings.yml, but listening inside the compose network. The secret key comes
# from SEARXNG_SECRET.
use_default_settings: true

general:
  instance_name: 'Hemmia search'
  enable_metrics: false

search:
  safe_search: 1 # moderate by default; Hemmia asks for strict (2) for teen accounts
  autocomplete: ''
  formats:
    - html
    - json

server:
  bind_address: '0.0.0.0'
  port: 8080
  limiter: false # only the hub container talks to it
  public_instance: false
  image_proxy: false
  method: 'GET'

ui:
  static_use_hash: true

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
