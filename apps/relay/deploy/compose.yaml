# The relay on any Linux host with Docker (RELAY.md §12). Secrets live in /srv/relay/secrets
# (0700) and are passed as files or an env file, never in this file or the repository.
#   cd /srv/relay && docker compose -f compose.yaml up -d
services:
  relay:
    image: ${RELAY_IMAGE:-hemmia-relay:latest}
    restart: always
    ports:
      - '443:443'
    env_file:
      - /srv/relay/secrets/relay.env
    environment:
      RELAY_DATA_DIR: /data
      RELAY_PORT: '443'
      APNS_KEY_FILE: /run/secrets/apns.p8
      FCM_SERVICE_ACCOUNT_FILE: /run/secrets/fcm.json
    volumes:
      - /srv/relay/data:/data
      - /srv/relay/secrets/apns.p8:/run/secrets/apns.p8:ro
      - /srv/relay/secrets/fcm.json:/run/secrets/fcm.json:ro
    # A misbehaving hub must not take the host down with it: the container restarts instead.
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # The journal keeps at most 14 days (setup-host.sh), as the privacy policy promises.
    logging:
      driver: journald
      options:
        tag: relay
