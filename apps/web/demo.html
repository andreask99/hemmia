<!doctype html>
<html lang="en" class="demo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- The hub's CSP (apps/server/src/security/http.ts) minus what a meta tag can't carry.
         The demo talks to nothing: every /api request is answered in the page (src/demo). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' blob: data:; script-src 'self'; style-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <meta name="robots" content="noindex" />
    <title>Hemmia demo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
