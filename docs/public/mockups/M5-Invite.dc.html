<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M5 Invite family</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f4d3f}a:hover{color:#173d32}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f1e8; color: #17231f; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 24px 36px; gap: 16px">
<a href="M4-Connected.dc.html" style="font-size: 15px; font-weight: 600; text-decoration: none">‹ Family</a>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 28px">Invite someone</h1>
<div role="radiogroup" aria-label="Account type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; background: #e9e2cd; padding: 4px; border-radius: 14px">
<button type="button" role="radio" aria-checked="true" style="min-height: 44px; border-radius: 11px; border: 0; background: #fffdf8; color: #17231f; font: 700 15px Manrope, system-ui, sans-serif">Adult</button>
<button type="button" role="radio" aria-checked="false" style="min-height: 44px; border-radius: 11px; border: 0; background: transparent; color: #4a4025; font: 600 15px Manrope, system-ui, sans-serif">Teen</button>
</div>
<div style="background: #fffdf8; border: 1px solid #e0dccf; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div role="img" aria-label="Invite QR code (illustration)" style="display: flex; flex-direction: column; background: #ffffff; padding: 10px">
<sc-for list="{{qr}}" as="row" hint-placeholder-count="25">
<div style="display: flex">
<sc-for list="{{row.cells}}" as="c" hint-placeholder-count="25">
<div style="width: 7px; height: 7px; background: {{c.bg}}"></div>
</sc-for>
</div>
</sc-for>
</div>
<div style="font-size: 14px; color: #55625c; text-align: center; line-height: 1.45">Let them scan this with their camera, or send the link.</div>
</div>
<button type="button" style="min-height: 52px; border-radius: 14px; border: 0; background: #1f4d3f; color: #f6f2e7; font: 600 16px Manrope, system-ui, sans-serif">Send invite link</button>
<p style="margin: 0; font-size: 13px; color: #55625c; text-align: center; line-height: 1.45">Works once, for 7 days. The link opens the app, or the App Store if they don't have it yet.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const n = 25;
const finder = (r, c) => {
const inBox = (r0, c0) => r >= r0 && r < r0 + 7 && c >= c0 && c < c0 + 7;
const box = inBox(0, 0) ? [0, 0] : inBox(0, n - 7) ? [0, n - 7] : inBox(n - 7, 0) ? [n - 7, 0] : null;
if (!box) return null;
const y = r - box[0], x = c - box[1];
return y === 0 || y === 6 || x === 0 || x === 6 || (y >= 2 && y <= 4 && x >= 2 && x <= 4);
};
let seed = 31;
const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
const qr = [];
for (let r = 0; r < n; r++) {
const cells = [];
for (let c = 0; c < n; c++) {
const f = finder(r, c);
cells.push({ bg: (f === null ? rnd() > 0.52 : f) ? '#17231f' : '#ffffff' });
}
qr.push({ cells });
}
return { qr };
}
}
</script>
</body>
</html>
