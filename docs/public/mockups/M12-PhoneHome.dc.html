<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M12 Phone home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f4d3f}a:hover{color:#173d32}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f1e8; color: #17231f; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; padding: 52px 20px 28px; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="36" height="36" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="36" fill="#1f4d3f"></circle><path d="M20 55V34a16 16 0 0 1 32 0v21l-5.33-4-5.34 4-5.33-4-5.33 4-5.34-4z" fill="#f4f1e8"></path><circle cx="30" cy="34" r="2.4" fill="#17231f"></circle><circle cx="42" cy="34" r="2.4" fill="#17231f"></circle><path d="M32.6 40q3.4 2.8 6.8 0" fill="none" stroke="#17231f" stroke-width="1.8" stroke-linecap="round"></path></svg>
<div style="display: flex; flex-direction: column"><span style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 20px">Hemmia</span><span style="font-size: 12px; font-weight: 600; color: #55625c">On this phone</span></div>
</div>
<a href="M13-PhoneSettings.dc.html" aria-label="Settings" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: #e9e2cd"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="#4a4025" stroke-width="2"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="#4a4025" stroke-width="2" stroke-linecap="round"></path></svg></a>
</div>
<label for="s" style="position: absolute; left: -9999px">Search chats</label>
<input id="s" placeholder="Search chats" style="height: 44px; border-radius: 12px; border: 1px solid #e0dccf; background: #fffdf8; padding: 0 14px; font: 500 15px Manrope, system-ui, sans-serif; color: #17231f">
<a href="A2-Chat.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; border-radius: 14px; background: #1f4d3f; color: #f6f2e7; font-weight: 600; font-size: 16px; text-decoration: none">+ New chat</a>
<div style="display: flex; flex-direction: column; background: #fffdf8; border: 1px solid #e0dccf; border-radius: 18px; overflow: hidden">
<sc-for list="{{chats}}" as="c" hint-placeholder-count="5">
<a href="A2-Chat.dc.html" style="display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-bottom: 1px solid #efe9da; text-decoration: none; color: #17231f; min-height: 44px; justify-content: center">
<span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 700; font-size: 15px">{{c.title}}</span><span style="font-size: 12px; color: #55625c; flex-shrink: 0">{{c.when}}</span></span>
<span style="font-size: 13px; color: #55625c">{{c.model}}</span>
</a>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<a href="M2-GetHub.dc.html" style="display: flex; gap: 12px; align-items: center; background: #e9e2cd; border-radius: 16px; padding: 14px 16px; text-decoration: none; color: #4a4025">
<svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true" style="flex-shrink: 0"><path d="M6 22L24 8l18 14v18H6z" fill="#fffdf8" stroke="#1f4d3f" stroke-width="2" stroke-linejoin="round"></path><path d="M17 40V30a7 7 0 0 1 14 0v10" fill="#e9e2cd" stroke="#1f4d3f" stroke-width="2"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 15px; color: #17231f">Set up Hemmia at home</span><span style="font-size: 13px; line-height: 1.4">For your family, local models and more. Your chats can come along.</span></span>
</a>
</div>
</x-dc>

</script>
</body>
</html>
