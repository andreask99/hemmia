[project]
name = "kchat-imagegen"
version = "0.1.0"
description = "kchat image worker: mflux over a stdio JSON-lines protocol (see PROTOCOL.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mflux==0.20.0",
    "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kchat_imagegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
